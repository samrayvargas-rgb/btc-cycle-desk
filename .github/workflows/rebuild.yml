name: refresh-data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure data files
        run: |
          mkdir -p data
          for f in btc-daily.json onchain.json signals.json rp-cycles.json; do
            if [ ! -f "data/$f" ] && [ -f "$f" ]; then cp "$f" "data/$f"; fi
          done
      - name: Rebuild
        run: python rebuild.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "cycle-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "refresh data"
          git push
