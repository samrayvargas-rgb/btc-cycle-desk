name: refresh-data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python rebuild.py
      - run: |
          git config user.name "cycle-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || git commit -m "refresh data"
          git push
